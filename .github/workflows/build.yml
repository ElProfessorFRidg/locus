name: Build IPA

on:
  # Every branch, not just main: a branch you can't install from is a branch you
  # can't test on a phone, and this app only really works on one.
  #
  # No `pull_request:` trigger — a PR from a branch in this repo would build the
  # same commit twice, and the push event is the one that can publish.
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  # Supersede rather than queue. The original worry was that cancelling a build
  # mid-upload leaves its release without an .ipa — but the run that supersedes
  # it deletes and recreates that release wholesale, so the gap closes itself.
  #
  # Queueing had a worse failure: one job that hangs blocks every push behind it
  # for the six-hour default timeout, including the push that fixes the hang.
  cancel-in-progress: true

jobs:
  build:
    # macOS 26 for the iOS 26 SDK. Liquid Glass (`glassEffect`,
    # `GlassEffectContainer`) sits behind `#available` guards, but the symbols
    # still have to exist at build time — an Xcode 16 runner fails outright
    # rather than falling back.
    runs-on: macos-26
    # The default is six hours. Nothing here legitimately takes more than a few
    # minutes, so a job past this is stuck and should say so rather than hold a
    # runner all afternoon.
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      # coreutils is here for `gtimeout`: macOS ships no GNU `timeout`, and a
      # test step that can hang needs one.
      - name: Install build tools
        run: brew install xcodegen xcbeautify coreutils

      # project.yml is the source of truth; the committed Locus.xcodeproj is a
      # generated artifact that goes stale whenever a target or file moves.
      # Regenerating here means CI can never build a project that doesn't match
      # the repo — in particular one missing the LocusTunnel extension.
      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Read version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(awk '/MARKETING_VERSION:/ { gsub(/[":]/, "", $2); print $2; exit }' project.yml)
          echo "version=${VERSION:-0.0.0}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      # Runs before the archive: a failing assertion should stop the build
      # rather than publish an IPA nobody has reason to trust.
      #
      # The test bundle is hosted by nothing on purpose — the app links a
      # device-only static library, so anything hosted by it can't run on a
      # simulator at all. See the LocusTests target in project.yml.
      - name: Test the logic
        timeout-minutes: 20
        run: |
          set -euo pipefail

          # By UDID, not by name. A name can match several devices across
          # installed runtimes, and an ambiguous `-destination` is one of the
          # ways xcodebuild sits there instead of failing.
          read -r UDID LABEL < <(xcrun simctl list devices available --json | python3 -c "
          import json, sys
          best = None
          for runtime, devices in json.load(sys.stdin)['devices'].items():
              if 'iOS' not in runtime:
                  continue
              for device in devices:
                  if not device.get('isAvailable') or not device['name'].startswith('iPhone'):
                      continue
                  # Highest runtime wins, then the later-sorting device name.
                  key = (runtime, device['name'])
                  if best is None or key > best[0]:
                      best = (key, device['udid'], f\"{device['name']} ({runtime.split('.')[-1]})\")
          print(f'{best[1]} {best[2]}' if best else '')
          ")
          test -n "${UDID:-}" || { echo '::error::No iPhone simulator available'; exit 1; }
          echo "Testing on $LABEL — $UDID"

          # Boot it ourselves and wait for it. Letting xcodebuild boot the
          # simulator is where the first run of this step hung: it waits on the
          # device without a deadline, and `bootstatus` is the supported way to
          # block until it is actually ready.
          xcrun simctl boot "$UDID" 2>/dev/null || true
          gtimeout 300 xcrun simctl bootstatus "$UDID" -b

          gtimeout 900 xcodebuild test \
            -project Locus.xcodeproj \
            -scheme LocusTests \
            -destination "id=$UDID" \
            -destination-timeout 120 \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

      # Unsigned: this IPA is re-signed locally with AltStore / SideStore /
      # Feather / Sideloadly / ESign before installing. Entitlements aren't
      # applied to an unsigned build, which is exactly why the app reads its own
      # embedded.mobileprovision at runtime rather than assuming it has them.
      - name: Archive (unsigned, device SDK)
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project Locus.xcodeproj \
            -scheme Locus \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath build/Locus.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            SKIP_INSTALL=NO \
            | xcbeautify

      - name: Package unsigned .ipa
        run: |
          set -euo pipefail
          APP="build/Locus.xcarchive/Products/Applications/Locus.app"
          test -d "$APP" || { echo "::error::No Locus.app in the archive"; exit 1; }
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Locus-unsigned.ipa Payload
          ls -lh Locus-unsigned.ipa

      # The whole built-in-tunnel feature is one bundle deep. If a build setting
      # ever drops the extension, the app degrades to "use LocalDevVPN" — correct
      # behaviour, but not something a release should ship without anyone
      # noticing. So CI fails here instead of shipping it quietly.
      - name: Verify the .ipa
        run: |
          set -euo pipefail
          unzip -t Locus-unsigned.ipa > /dev/null
          echo "Archive is a valid zip."

          CONTENTS=$(unzip -l Locus-unsigned.ipa)

          grep -q "Payload/Locus.app/Locus$" <<< "$CONTENTS" \
            || { echo "::error::App binary missing from the IPA"; exit 1; }

          grep -q "Payload/Locus.app/PlugIns/LocusTunnel.appex/LocusTunnel$" <<< "$CONTENTS" \
            || { echo "::error::LocusTunnel.appex missing — this build would have no built-in tunnel"; exit 1; }

          grep -q "Payload/Locus.app/PlugIns/LocusWidgets.appex/LocusWidgets$" <<< "$CONTENTS" \
            || { echo "::error::LocusWidgets.appex missing — no Live Activity in this build"; exit 1; }

          echo "App binary and both extensions present."

          # The extension is useless without its packet-tunnel extension point.
          PLIST="Payload/Locus.app/PlugIns/LocusTunnel.appex/Info.plist"
          unzip -o -q Locus-unsigned.ipa "$PLIST" -d verify
          POINT=$(/usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPointIdentifier" "verify/$PLIST")
          test "$POINT" = "com.apple.networkextension.packet-tunnel" \
            || { echo "::error::Extension point is '$POINT', expected com.apple.networkextension.packet-tunnel"; exit 1; }
          echo "Extension point: $POINT"


      # Name the file for what it is. A tagged release keeps its version in the
      # filename; a branch build keeps a fixed name so its download URL never
      # moves — see the rolling release below.
      - name: Name the .ipa
        id: artifact
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            NAME="Locus-${GITHUB_REF#refs/tags/}.ipa"
          else
            NAME="Locus.ipa"
          fi
          mv Locus-unsigned.ipa "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ls -lh "$NAME"

      # Kept alongside the Release as a fallback if publishing fails. Note that
      # what you download from here IS wrapped in a second .zip by GitHub — the
      # Release asset below is the raw .ipa.
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Locus-${{ steps.version.outputs.version }}-${{ steps.version.outputs.short_sha }}
          path: ${{ steps.artifact.outputs.name }}
          retention-days: 30
          if-no-files-found: error

      - name: Decide where this build gets published
        id: release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHORT_SHA: ${{ steps.version.outputs.short_sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            TITLE="Locus $TAG"
            ROLLING=false
          else
            # One rolling release per branch, replaced on every push, so the
            # download URL is stable and there is exactly one build to grab
            # rather than a list to date-sort by hand.
            BRANCH="${GITHUB_REF#refs/heads/}"
            SLUG=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9]#-#g' | sed 's#--*#-#g' | sed 's#^-##;s#-$##')
            if [[ "$BRANCH" == "main" ]]; then TAG="latest"; else TAG="latest-$SLUG"; fi
            TITLE="Locus ${VERSION} — ${BRANCH} (${SHORT_SHA})"
            ROLLING=true
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "rolling=$ROLLING" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        env:
          SHORT_SHA: ${{ steps.version.outputs.short_sha }}
          FILE: ${{ steps.artifact.outputs.name }}
        run: |
          cat > release-notes.md <<EOF
          Unsigned build of \`${SHORT_SHA}\` on \`${GITHUB_REF_NAME}\`. Re-sign before installing — AltStore, SideStore, Feather, Sideloadly or ESign.

          Download **\`${FILE}\`** below. It is the raw \`.ipa\`, not a zip: sideloaders can open it straight from this link.

          **About the built-in tunnel.** Signing it needs a **paid** Apple developer account — Apple doesn't grant \`packet-tunnel-provider\` to free ones. Re-signed with a free profile, Locus detects that at launch and points you at the [LocalDevVPN](https://apps.apple.com/us/app/localdevvpn/id6755608044) app instead; it raises the same tunnel on 10.7.0.1 and everything else works the same.
          EOF

      # actions/upload-artifact always wraps its output in a second .zip for
      # browser downloads. A Release attaches the .ipa directly — one file, one
      # tap, installable from the link on the phone itself.
      - name: Publish the .ipa to a Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          TITLE: ${{ steps.release.outputs.title }}
          ROLLING: ${{ steps.release.outputs.rolling }}
          FILE: ${{ steps.artifact.outputs.name }}
        run: |
          set -euo pipefail

          # A rolling tag has to move to this commit, and GitHub won't move a tag
          # under an existing release — so the old one goes first. Delete then
          # create, rather than edit, keeps the tag and the build in step.
          if [[ "$ROLLING" == "true" ]] && gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY"
          fi

          # --target pins the new tag to the commit that was actually built.
          # Without it `gh release create` creates the tag on the default
          # branch, so the release's own "source code" links and commitish
          # pointed at main while its .ipa came from this branch.
          if [[ "$ROLLING" == "true" ]]; then
            gh release create "$TAG" "$FILE" \
              --title "$TITLE" \
              --notes-file release-notes.md \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --prerelease
          else
            gh release create "$TAG" "$FILE" \
              --title "$TITLE" \
              --notes-file release-notes.md \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA"
          fi

      # The point of a stable tag is a link you can bookmark. Print it where the
      # run already is, so it needn't be reconstructed from the branch name.
      - name: Show the download link
        env:
          TAG: ${{ steps.release.outputs.tag }}
          FILE: ${{ steps.artifact.outputs.name }}
        run: |
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${FILE}"
          {
            echo "## Install"
            echo
            echo "Direct \`.ipa\` (no zip):"
            echo
            echo "\`\`\`"
            echo "$URL"
            echo "\`\`\`"
            echo
            echo "Release page: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$URL"
