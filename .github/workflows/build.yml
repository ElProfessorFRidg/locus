name: Build IPA

on:
  # Every branch, not just main: a branch you can't install from is a branch you
  # can't test on a phone, and this app only really works on one.
  #
  # No `pull_request:` trigger — a PR from a branch in this repo would build the
  # same commit twice, and the push event is the one that can publish.
  push:
    branches: ["**"]
    tags: ["v*"]
    # A push that only touches prose has nothing to build. (Path filters don't
    # apply to tag pushes, so a release tag always builds.)
    paths-ignore:
      - "**.md"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  # Supersede rather than queue. The original worry was that cancelling a build
  # mid-upload leaves its release without an .ipa — but the run that supersedes
  # it deletes and recreates that release wholesale, so the gap closes itself.
  #
  # Queueing had a worse failure: one job that hangs blocks every push behind it
  # for the six-hour default timeout, including the push that fixes the hang.
  cancel-in-progress: true

jobs:
  # The logic tests, on the Mac itself. They are pure Swift (see the LocusTests
  # target in project.yml), so they need no iOS simulator — booting one was
  # most of what this used to cost. Runs alongside `build`; `publish` waits for
  # both, so a failing test still keeps a build from being released.
  test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Describe the logic tests as a Swift package
        run: python3 .github/scripts/logic-package.py

      - name: Cache the package build
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-logic-${{ runner.os }}-${{ hashFiles('project.yml', 'Tests/**', 'Locus/**/*.swift', 'LocusTunnel/Shared/**') }}
          restore-keys: |
            spm-logic-${{ runner.os }}-

      - name: Test the logic
        run: swift test

  build:
    # macOS 26 for the iOS 26 SDK. Liquid Glass (`glassEffect`,
    # `GlassEffectContainer`) sits behind `#available` guards, but the symbols
    # still have to exist at build time — an Xcode 16 runner fails outright
    # rather than falling back.
    runs-on: macos-26
    # The default is six hours. Nothing here legitimately takes more than a few
    # minutes, so a job past this is stuck and should say so rather than hold a
    # runner all afternoon.
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.version }}
      short_sha: ${{ steps.version.outputs.short_sha }}
      artifact: ${{ steps.version.outputs.artifact }}
      file: ${{ steps.artifact.outputs.name }}
      tipa: ${{ steps.artifact.outputs.tipa }}
      rootless: ${{ steps.artifact.outputs.rootless }}
      rootful: ${{ steps.artifact.outputs.rootful }}

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      # Homebrew's auto-update and cleanup are what make a small install slow
      # on a fresh runner, and neither changes what gets installed. ldid signs
      # the TrollStore build and dpkg packs the jailbreak ones.
      - name: Install build tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_ENV_HINTS: "1"
        run: brew install xcodegen xcbeautify ldid dpkg

      # Incremental builds: DerivedData keyed on the project definition, with the
      # last run's cache as the fallback so a push that touches a few files
      # recompiles those files instead of everything.
      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: build/DerivedData
          key: derived-${{ runner.os }}-${{ hashFiles('project.yml') }}-${{ github.sha }}
          restore-keys: |
            derived-${{ runner.os }}-${{ hashFiles('project.yml') }}-
            derived-${{ runner.os }}-

      # project.yml is the source of truth; the committed Locus.xcodeproj is a
      # generated artifact that goes stale whenever a target or file moves.
      # Regenerating here means CI can never build a project that doesn't match
      # the repo — in particular one missing the LocusTunnel extension.
      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Read version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(awk '/MARKETING_VERSION:/ { gsub(/[":]/, "", $2); print $2; exit }' project.yml)
          echo "version=${VERSION:-0.0.0}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "artifact=Locus-${VERSION:-0.0.0}-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      # Unsigned: this IPA is re-signed locally with AltStore / SideStore /
      # Feather / Sideloadly / ESign before installing. Entitlements aren't
      # applied to an unsigned build, which is exactly why the app reads its own
      # embedded.mobileprovision at runtime rather than assuming it has them.
      - name: Archive (unsigned, device SDK)
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project Locus.xcodeproj \
            -scheme Locus \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath build/Locus.xcarchive \
            -derivedDataPath build/DerivedData \
            COMPILER_INDEX_STORE_ENABLE=NO \
            DEBUG_INFORMATION_FORMAT=dwarf \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            SKIP_INSTALL=NO \
            | xcbeautify

      - name: Package unsigned .ipa
        run: |
          set -euo pipefail
          APP="build/Locus.xcarchive/Products/Applications/Locus.app"
          test -d "$APP" || { echo "::error::No Locus.app in the archive"; exit 1; }
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Locus-unsigned.ipa Payload
          ls -lh Locus-unsigned.ipa

      # The whole built-in-tunnel feature is one bundle deep. If a build setting
      # ever drops the extension, the app degrades to "use LocalDevVPN" — correct
      # behaviour, but not something a release should ship without anyone
      # noticing. So CI fails here instead of shipping it quietly.
      - name: Verify the .ipa
        run: |
          set -euo pipefail
          unzip -t Locus-unsigned.ipa > /dev/null
          echo "Archive is a valid zip."

          CONTENTS=$(unzip -l Locus-unsigned.ipa)

          grep -q "Payload/Locus.app/Locus$" <<< "$CONTENTS" \
            || { echo "::error::App binary missing from the IPA"; exit 1; }

          grep -q "Payload/Locus.app/PlugIns/LocusTunnel.appex/LocusTunnel$" <<< "$CONTENTS" \
            || { echo "::error::LocusTunnel.appex missing — this build would have no built-in tunnel"; exit 1; }

          grep -q "Payload/Locus.app/PlugIns/LocusWidgets.appex/LocusWidgets$" <<< "$CONTENTS" \
            || { echo "::error::LocusWidgets.appex missing — no Live Activity in this build"; exit 1; }

          echo "App binary and both extensions present."

          # The extension is useless without its packet-tunnel extension point.
          PLIST="Payload/Locus.app/PlugIns/LocusTunnel.appex/Info.plist"
          unzip -o -q Locus-unsigned.ipa "$PLIST" -d verify
          POINT=$(/usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPointIdentifier" "verify/$PLIST")
          test "$POINT" = "com.apple.networkextension.packet-tunnel" \
            || { echo "::error::Extension point is '$POINT', expected com.apple.networkextension.packet-tunnel"; exit 1; }
          echo "Extension point: $POINT"

      # The same app, signed for TrollStore. TrollStore keeps whatever
      # entitlements a binary was signed with, which no sideloader can do — so
      # this copy holds com.apple.locationd.simulation and sets the location
      # through CLSimulationManager directly, the way Geranium's LocSim does:
      # no pairing file, no tunnel. Built from the very same .app as the .ipa,
      # so the two can't drift apart.
      - name: Package TrollStore .tipa
        run: |
          set -euo pipefail
          rm -rf tipa && mkdir -p tipa
          cp -R Payload tipa/
          APP="tipa/Payload/Locus.app"

          # Inside out: anything nested is signed before what contains it.
          find "$APP" \( -name "*.dylib" -o -name "*.framework" \) -print0 2>/dev/null \
            | while IFS= read -r -d '' item; do
                if [ -d "$item" ]; then
                  BIN="$item/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$item/Info.plist")"
                else
                  BIN="$item"
                fi
                ldid -S "$BIN"
              done
          ldid -S"LocusTunnel/LocusTunnel.entitlements" "$APP/PlugIns/LocusTunnel.appex/LocusTunnel"
          ldid -S"TrollStore/LocusWidgets.entitlements" "$APP/PlugIns/LocusWidgets.appex/LocusWidgets"
          ldid -S"TrollStore/Locus.entitlements" "$APP/Locus"

          # A .tipa without the entitlement would install fine and then quietly
          # fall back to asking for a pairing file — exactly what it exists to
          # avoid. So it is checked, not assumed.
          ldid -e "$APP/Locus" > tipa/entitlements.plist
          [[ "$(/usr/libexec/PlistBuddy -c "Print :com.apple.locationd.simulation" tipa/entitlements.plist)" == "true" ]] \
            || { echo "::error::Locus.tipa is missing com.apple.locationd.simulation"; exit 1; }
          echo "Signed with:"; cat tipa/entitlements.plist

          # Every binary signed, not just the one checked above — an unsigned
          # extension is refused at install time on a jailbreak, and silently
          # left out on TrollStore.
          for BIN in "$APP/Locus" "$APP/PlugIns/LocusTunnel.appex/LocusTunnel" "$APP/PlugIns/LocusWidgets.appex/LocusWidgets"; do
            # Captured first: piped straight into `grep -q` under pipefail,
            # an early grep exit fails the pipeline on a signed binary.
            INFO=$(codesign -dv "$BIN" 2>&1 || true)
            grep -q "^CodeDirectory " <<< "$INFO" \
              || { echo "$INFO"; echo "::error::$BIN is not signed"; exit 1; }
            echo "$BIN: $(grep '^CodeDirectory ' <<< "$INFO")"
          done

          # TrollStore reaches iOS 17.0 at the very most. A build that asks for
          # more than that would install nowhere this .tipa is for.
          MINOS=$(/usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP/Info.plist")
          echo "MinimumOSVersion: $MINOS"
          [[ "$MINOS" == "17.0" ]] \
            || { echo "::error::MinimumOSVersion is $MINOS; TrollStore needs the app to run on 17.0"; exit 1; }

          (cd tipa && zip -qry ../Locus.tipa Payload)
          unzip -t Locus.tipa > /dev/null
          ls -lh Locus.tipa

      # The same signed app again, as packages for a jailbreak's package
      # manager (Sileo, Zebra). Rootless jailbreaks (Dopamine, palera1n,
      # nathanlr) install under /var/jb and want iphoneos-arm64; rootful ones
      # install into /Applications and want iphoneos-arm. The binaries are the
      # .tipa's, entitlement included, so the package sets the location
      # directly too.
      - name: Package jailbreak .debs
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          for FLAVOUR in rootless rootful; do
            if [[ "$FLAVOUR" == "rootless" ]]; then
              APPS="var/jb/Applications"; ARCH="iphoneos-arm64"
            else
              APPS="Applications"; ARCH="iphoneos-arm"
            fi
            ROOT="deb-$FLAVOUR"
            rm -rf "$ROOT"
            mkdir -p "$ROOT/DEBIAN" "$ROOT/$APPS"
            cp -R tipa/Payload/Locus.app "$ROOT/$APPS/"

            cat > "$ROOT/DEBIAN/control" <<CONTROL
          Package: com.chrismack.locus
          Name: Locus
          Version: ${VERSION}-${GITHUB_RUN_NUMBER}
          Architecture: ${ARCH}
          Description: Location teleport, joystick and route driving. Sets the location directly through locationd — no pairing file, no tunnel.
          Maintainer: Locus
          Author: Locus
          Section: Utilities
          Depends: firmware (>= 17.0)
          CONTROL
            # dpkg rejects a control file whose fields are indented.
            sed -i '' -e 's/^ *//' "$ROOT/DEBIAN/control"

            # Registers the app with SpringBoard on install, and drops it on
            # removal — a package that installs an app nobody can see is the
            # classic broken jailbreak .deb.
            printf '#!/bin/sh\nuicache -p "/%s/Locus.app" || true\nexit 0\n' "$APPS" > "$ROOT/DEBIAN/postinst"
            printf '#!/bin/sh\nif [ "$1" = remove ] || [ "$1" = purge ]; then uicache -u "/%s/Locus.app" || true; fi\nexit 0\n' "$APPS" > "$ROOT/DEBIAN/prerm"
            chmod 0755 "$ROOT/DEBIAN/postinst" "$ROOT/DEBIAN/prerm"

            dpkg-deb -Zxz --root-owner-group -b "$ROOT" "Locus-$FLAVOUR.deb"

            # Check what was built, not what was meant to be.
            # Captured rather than piped into `grep -q`, which under pipefail
            # fails the step whenever grep stops reading early.
            BUILT_ARCH=$(dpkg-deb -f "Locus-$FLAVOUR.deb" Architecture)
            [[ "$BUILT_ARCH" == "$ARCH" ]] \
              || { echo "::error::Locus-$FLAVOUR.deb is $BUILT_ARCH, expected $ARCH"; exit 1; }
            LISTING=$(dpkg-deb -c "Locus-$FLAVOUR.deb")
            grep -q "\./$APPS/Locus.app/Locus$" <<< "$LISTING" \
              || { echo "::error::Locus-$FLAVOUR.deb doesn't put Locus.app in /$APPS"; exit 1; }
            echo "Locus-$FLAVOUR.deb:"; dpkg-deb -I "Locus-$FLAVOUR.deb"
          done
          ls -lh Locus-*.deb


      # Name the file for what it is. A tagged release keeps its version in the
      # filename; a branch build keeps a fixed name so its download URL never
      # moves — see the rolling release below.
      - name: Name the .ipa
        id: artifact
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            STEM="Locus-${GITHUB_REF#refs/tags/}"
          else
            STEM="Locus"
          fi
          NAME="$STEM.ipa"
          TIPA="$STEM.tipa"
          ROOTLESS="$STEM-rootless.deb"
          ROOTFUL="$STEM-rootful.deb"
          mv Locus-unsigned.ipa "$NAME"
          [[ "$TIPA" == "Locus.tipa" ]] || mv Locus.tipa "$TIPA"
          [[ "$ROOTLESS" == "Locus-rootless.deb" ]] || mv Locus-rootless.deb "$ROOTLESS"
          [[ "$ROOTFUL" == "Locus-rootful.deb" ]] || mv Locus-rootful.deb "$ROOTFUL"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tipa=$TIPA" >> "$GITHUB_OUTPUT"
          echo "rootless=$ROOTLESS" >> "$GITHUB_OUTPUT"
          echo "rootful=$ROOTFUL" >> "$GITHUB_OUTPUT"
          ls -lh "$NAME" "$TIPA" "$ROOTLESS" "$ROOTFUL"

      # Kept alongside the Release as a fallback if publishing fails. Note that
      # what you download from here IS wrapped in a second .zip by GitHub — the
      # Release asset below is the raw .ipa.
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: |
            ${{ steps.artifact.outputs.name }}
            ${{ steps.artifact.outputs.tipa }}
            ${{ steps.artifact.outputs.rootless }}
            ${{ steps.artifact.outputs.rootful }}
          retention-days: 30
          if-no-files-found: error

  # Releases only what both jobs vouched for: the tests passed and the .ipa
  # built. On Linux, because all it does is talk to GitHub.
  publish:
    needs: [test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch the .ipa
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}

      - name: Decide where this build gets published
        id: release
        env:
          VERSION: ${{ needs.build.outputs.version }}
          SHORT_SHA: ${{ needs.build.outputs.short_sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            TITLE="Locus $TAG"
            ROLLING=false
          else
            # One rolling release per branch, replaced on every push, so the
            # download URL is stable and there is exactly one build to grab
            # rather than a list to date-sort by hand.
            BRANCH="${GITHUB_REF#refs/heads/}"
            SLUG=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9]#-#g' | sed 's#--*#-#g' | sed 's#^-##;s#-$##')
            if [[ "$BRANCH" == "main" ]]; then TAG="latest"; else TAG="latest-$SLUG"; fi
            TITLE="Locus ${VERSION} — ${BRANCH} (${SHORT_SHA})"
            ROLLING=true
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "rolling=$ROLLING" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        env:
          SHORT_SHA: ${{ needs.build.outputs.short_sha }}
          FILE: ${{ needs.build.outputs.file }}
          TIPA: ${{ needs.build.outputs.tipa }}
          ROOTLESS: ${{ needs.build.outputs.rootless }}
          ROOTFUL: ${{ needs.build.outputs.rootful }}
        run: |
          cat > release-notes.md <<EOF
          Unsigned build of \`${SHORT_SHA}\` on \`${GITHUB_REF_NAME}\`. Re-sign before installing — AltStore, SideStore, Feather, Sideloadly or ESign.

          Download **\`${FILE}\`** below. It is the raw \`.ipa\`, not a zip: sideloaders can open it straight from this link.

          **On a TrollStore device, take \`${TIPA}\` instead** and open it in TrollStore. It is the same app signed with \`com.apple.locationd.simulation\`, so Locus sets the location directly — the way Geranium's LocSim does — with no pairing file and no tunnel. TrollStore covers iOS 14.0 – 17.0; Locus needs iOS 17.0 or later, so in practice that means a TrollStore install on iOS 17.0.

          **Jailbroken (iOS 17 or later)?** Install \`${ROOTLESS}\` (Dopamine, palera1n rootless, nathanlr — anything with \`/var/jb\`) or \`${ROOTFUL}\` (rootful palera1n) with Sileo, Zebra or Filza. Same app, same entitlement, same direct simulation. \`${TIPA}\` also installs through TrollStore on a jailbreak, or Filza with AppSync Unified. Don't run it through a sideloader: re-signing strips the entitlement, and Locus falls back to asking for a pairing file.

          **About the built-in tunnel.** Signing it needs a **paid** Apple developer account — Apple doesn't grant \`packet-tunnel-provider\` to free ones. Re-signed with a free profile, Locus detects that at launch and points you at the [LocalDevVPN](https://apps.apple.com/us/app/localdevvpn/id6755608044) app instead; it raises the same tunnel on 10.7.0.1 and everything else works the same.
          EOF

      # actions/upload-artifact always wraps its output in a second .zip for
      # browser downloads. A Release attaches the .ipa directly — one file, one
      # tap, installable from the link on the phone itself.
      - name: Publish the .ipa to a Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          TITLE: ${{ steps.release.outputs.title }}
          ROLLING: ${{ steps.release.outputs.rolling }}
          FILE: ${{ needs.build.outputs.file }}
          TIPA: ${{ needs.build.outputs.tipa }}
          ROOTLESS: ${{ needs.build.outputs.rootless }}
          ROOTFUL: ${{ needs.build.outputs.rootful }}
        run: |
          set -euo pipefail

          # A rolling tag has to move to this commit, and GitHub won't move a tag
          # under an existing release — so the old one goes first. Delete then
          # create, rather than edit, keeps the tag and the build in step.
          if [[ "$ROLLING" == "true" ]] && gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY"
          fi

          # --target pins the new tag to the commit that was actually built.
          # Without it `gh release create` creates the tag on the default
          # branch, so the release's own "source code" links and commitish
          # pointed at main while its .ipa came from this branch.
          if [[ "$ROLLING" == "true" ]]; then
            gh release create "$TAG" "$FILE" "$TIPA" "$ROOTLESS" "$ROOTFUL" \
              --title "$TITLE" \
              --notes-file release-notes.md \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --prerelease
          else
            gh release create "$TAG" "$FILE" "$TIPA" "$ROOTLESS" "$ROOTFUL" \
              --title "$TITLE" \
              --notes-file release-notes.md \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA"
          fi

      # The point of a stable tag is a link you can bookmark. Print it where the
      # run already is, so it needn't be reconstructed from the branch name.
      - name: Show the download link
        env:
          TAG: ${{ steps.release.outputs.tag }}
          FILE: ${{ needs.build.outputs.file }}
          TIPA: ${{ needs.build.outputs.tipa }}
          ROOTLESS: ${{ needs.build.outputs.rootless }}
          ROOTFUL: ${{ needs.build.outputs.rootful }}
        run: |
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${FILE}"
          TIPA_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${TIPA}"
          {
            echo "## Install"
            echo
            echo "Direct \`.ipa\` (no zip):"
            echo
            echo "\`\`\`"
            echo "$URL"
            echo "\`\`\`"
            echo
            echo "TrollStore (direct simulation, no tunnel):"
            echo
            echo "\`\`\`"
            echo "$TIPA_URL"
            echo "\`\`\`"
            echo
            echo "Jailbreak packages: [rootless]($BASE/$ROOTLESS) · [rootful]($BASE/$ROOTFUL)"
            echo
            echo "Release page: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$URL"
          echo "$TIPA_URL"
